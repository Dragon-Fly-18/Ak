<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: deepskyblue;
            display: flex;
            justify-content: center;
            align-items: center;       
        }
        .board{
            width: 800px;
            height: 800px;
            background-color: white;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            box-shadow: 10px 10px 5px;
        }
        .box{
            width: 100px;
            height: 100px;
            font-size: 75px;
            text-align: center;
        }
        .box:hover{
            transform: scale(1.2);
            border-radius: 20px;
            transition: 0.5s;
        }
        .black{
            background-color: grey;
        }
    </style>
</head>
<body>
    <div class="board">
        <div class="box"></div>
        <div class="box black"></div>
        <div class="box"></div>
        <div class="box black"></div>
        <div class="box"></div>
        <div class="box black"></div>
        <div class="box"></div>
        <div class="box black"></div>
    </div>
</html>
